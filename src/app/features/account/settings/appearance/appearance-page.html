<div class="appearance-block">
  <h3>{{ 'Цветовая палитра' | uppercase }}</h3>
  <div class="appearance-list">
    @for (palette of appearanceService.paletteKeys; track palette) {
      <div 
        class="appearance-palette__list-item" 
        [style.--accent-color]="appearanceService.palettes[palette]"
        [ngClass]="{
          'selected-palette': appearanceService.currentPalette === palette
        }"
        (click)="appearanceService.setPalette(palette)"
      ></div>
    }
  </div>
</div>

<div class="appearance-block">
  <h3>{{ 'Тема' | uppercase }}</h3>
  <div class="appearance-list">
    <div 
      class="appearance-theme__list-item dark" 
      (click)="appearanceService.setTheme('dark')"
      [ngClass]="{
        'selected-theme': appearanceService.currentTheme === 'dark'
      }"
    ></div>
    <div 
      class="appearance-theme__list-item light" 
      (click)="appearanceService.setTheme('light')"
      [ngClass]="{
        'selected-theme': appearanceService.currentTheme === 'light'
      }"
    ></div>
  </div>
</div>  

<div class="appearance-block">
  <h3>{{ 'Отображение карточек' | uppercase }}</h3>
  <div class="appearance-list">
    <app-checkbox 
      [isChecked]="appearanceService.cardsViewMode === 'compact'"
      (isCheckedChange)="appearanceService.setCardsViewMode('compact')"
      variant="radio" 
      label="Компактный вид"
    ></app-checkbox>
    <app-checkbox 
      [isChecked]="appearanceService.cardsViewMode === 'default'"
      (isCheckedChange)="appearanceService.setCardsViewMode('default')"
      variant="radio" 
      label="Стандартный вид"
    ></app-checkbox>
  </div>
</div>
