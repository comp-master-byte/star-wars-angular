<app-auth-template
  title="Новый пароль"
>
  <form class="reset-password__form" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <div class="reset-password__input-wrapper">
      <label class="ui-input__label">Никнейм</label>
      <input
        type="text"
        class="ui-input"
        placeholder="Введите никнейм"
        formControlName="nickname"
      />
      @if(nicknameError) {
        <p class="ui-input__error">
          {{ nicknameError }}
        </p>
      }
    </div>
    <div class="reset-password__input-wrapper">
      <label class="ui-input__label">Новый пароль</label>
      <input
        type="password"
        class="ui-input"
        placeholder="Введите новый пароль"
        formControlName="newPassword"
      />
      @if(newPasswordError) {
        <p class="ui-input__error">
          {{ newPasswordError }}
        </p>
      }
    </div>
    <div class="reset-password__input-wrapper">
      <label class="ui-input__label">Повторите новый пароль</label>
      <input
        type="password"
        class="ui-input"
        placeholder="Повторите новый пароль"
        formControlName="repeatNewPassword"
      />
      @if(repeatNewPasswordError) {
        <p class="ui-input__error">
          {{ repeatNewPasswordError }}
        </p>
      }
    </div>

    <button 
      class="ui-button" 
      type="submit"
      [disabled]="isDisabledSubmitBtn"
    >
      Обновить пароль
    </button>

    <div class="sign-up-wrapper">
      <a class="sign-up-txt" routerLink="/sign-in">Вернуться к входу</a>
    </div>
  </form>
</app-auth-template>
