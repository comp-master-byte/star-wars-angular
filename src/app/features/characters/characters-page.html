
@if(charactersService.isLoading()) {
  <app-loader></app-loader>
} @else {
  @if(charactersService.error()) {
    <app-server-error></app-server-error>
  } @else {
    <app-input 
      [(model)]="query"
      placeholder="Поиск персонажей..."
    />
    <div class="flex gap-[15px] flex-wrap">
      @for(character of charactersService.charactersList() | filterList: query : queryKeys; track character.name) {
        <app-character-list-item [character]="character"></app-character-list-item>
      } @empty {
        <app-empty-search></app-empty-search>
      }
    </div>
  }
}
