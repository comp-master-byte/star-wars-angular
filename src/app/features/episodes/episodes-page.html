@if(filmsService.isLoading()) {
  <app-loader></app-loader>
} @else {
  @if(filmsService.error()) {
    <app-server-error></app-server-error>
  } @else {
    <app-input [(model)]="query" placeholder="Поиск фильмов..." />
    <div class="flex gap-[15px] flex-wrap">
      @for (film of filmsService.filmsList() | filterList: query : searchQuery; track film.episodeId) {
        <app-episode-list-item [film]="film"></app-episode-list-item>
      } @empty {
        <app-empty-search></app-empty-search>
      }
    </div>
  }
}
