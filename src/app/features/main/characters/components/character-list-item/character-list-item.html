<app-render-list-item
  [title]="character().name"
  [image]="character().img || ''"
  [accentColor]="character().color || ''"
  [subtitle]="character().designation || 'Житель галактики'"
  (onRenderItemClick)="handleCharacterItemClick()"
  imagePlaceholder="/assets/characters/placeholder.jpeg"
>
  <div class="character-card__stats">
    <span class="character-stat">
      <span class="character-stat__label">Рост</span>
      <span class="character-stat__value">{{ character().height }}</span>
    </span>
    <span class="character-stat">
      <span class="character-stat__label">Год</span>
      <span class="character-stat__value">{{ character().birthYear }}</span>
    </span>
    <span class="character-stat">
      <span class="character-stat__label">Масса</span>
      <span class="character-stat__value">{{ character().mass }}</span>
    </span>
  </div>
</app-render-list-item>
