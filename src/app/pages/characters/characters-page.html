
@if(charactersService.isLoading()) {
  <div class="flex items-center justify-center flex-col relative">
    <img class="w-[300px] animate-float-spin" src="star-wars-logo.png">
    <p class="absolute bottom-[20px]">Loading...</p>
  </div>
} @else {
  <div class="flex gap-[15px] flex-wrap">
    @for(character of charactersService.charactersList(); track character.name) {
      <app-character [character]="character"></app-character>
    }
  </div>
}
