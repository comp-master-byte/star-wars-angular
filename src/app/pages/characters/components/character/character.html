<div
  class="
    group relative w-[300px] h-[400px] rounded-lg
    bg-bg-main
    border border-main/20
    overflow-hidden
    flex flex-col items-center
    shadow-lg shadow-black/50
    transition-all duration-300
    hover:border-main hover:shadow-main/10 hover:-translate-y-1
  "
>
  <div class="relative w-full h-[260px] overflow-hidden">
    @if (character(); as character) {
      <img
        [src]="charactersExtraData[character.id]?.img ?? ''"
        class="w-full h-full object-cover ..."
      />
    }
    <div class="absolute inset-0 bg-gradient-to-t from-bg-main via-transparent to-transparent"></div>
  </div>
  <div class="flex-1 w-full flex flex-col items-center justify-center px-4 py-3 text-center">
    <h3 class="text-white text-lg font-semibold tracking-wide">
      {{character()?.name}}
    </h3>
    <p class="text-main text-xs uppercase tracking-widest mt-1">
      Star Wars
    </p>
    <div class="flex flex-wrap justify-center gap-2 mt-3 text-neutral-400 text-xs">
      <span class="px-2 py-1 rounded-full bg-main/5 border border-main/20">
        Height {{character()?.height}}
      </span>
      <span class="px-2 py-1 rounded-full bg-main/5 border border-main/20">
        Birth year {{character()?.birthYear}}
      </span>
      <span class="px-2 py-1 rounded-full bg-main/5 border border-main/20">
        Mass {{character()?.mass}}
      </span>
    </div>
  </div>
</div>
