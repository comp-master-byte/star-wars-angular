@if(filmsService.isLoading()) {
  <app-loader></app-loader>
} @else {
  <input 
    type="text" 
    [(ngModel)]="searchFilmField"
    placeholder="Поиск фильмов..."
    class="
      w-full max-w-[420px] mb-8 px-4 py-3
      bg-black/70
      border border-main/40
      rounded-sm
      text-main
      placeholder:text-main/30
      font-mono
      tracking-wider
      uppercase
      outline-none
      shadow-[0_0_20px_rgba(255,232,31,0.08)]
      transition-all duration-300
      focus:border-main
      focus:shadow-[0_0_28px_rgba(255,232,31,0.22)]
    "
  >
  <div class="flex gap-[15px] flex-wrap">
    @for (film of filmsService.filmsList() | filterFilms: searchFilmField; track film.episodeId) {
      <app-film-card [film]="film"></app-film-card>
    }
  </div>
}
