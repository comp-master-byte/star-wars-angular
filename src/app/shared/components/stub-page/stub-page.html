<section class="stub-page">
  <div class="stub-page__decor">
    <div class="stub-page__station"></div>
    <div class="stub-page__orbit stub-page__orbit--outer"></div>
    <div class="stub-page__orbit stub-page__orbit--inner"></div>
    <div class="stub-page__satellite"></div>
  </div>

  <div class="stub-page__content">
    <p class="stub-page__eyebrow">{{ eyebrow() }}</p>
    <h1 class="stub-page__title">{{ title() }}</h1>
    <p class="stub-page__description">{{ description() }}</p>

    <div class="stub-page__status">
      <span class="stub-page__status-dot"></span>
      <span>Передача ожидается</span>
    </div>
  </div>
</section>
