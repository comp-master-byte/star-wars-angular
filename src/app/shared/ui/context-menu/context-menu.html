@if(isVisible()) {
  <div class="context-menu">
    <ul class="context-menu__list">
      @for(option of options(); track option.id) {
        <li 
          class="context-menu__item"
          [class.context-menu__item--danger]="option.variant === 'danger'"
          (click)="handleSelectOption(option)"
        >
          {{option.label}}
        </li>
      }
    </ul>
  </div>
}
